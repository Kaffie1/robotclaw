<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobotClaw</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">RobotClaw</div>
        </div>

        <button class="new-session-button" id="newSessionButton" type="button">
          <span class="new-session-plus">+</span>
          <span>新建会话</span>
        </button>

        <section class="session-panel">
          <div class="section-title">会话列表</div>
          <div class="session-list" id="sessionList"></div>
        </section>

        <button class="settings-link" type="button">
          <span class="settings-icon">⚙</span>
          <span>设置</span>
        </button>
      </aside>

      <main class="chat-stage">
        <section class="chat-card">
          <div class="chat-scroll" id="chatScroll"></div>

          <div class="composer">
            <div class="composer-modebar">
              <label class="mode-field" for="interactionModeSelect">
                <span class="mode-label">当前模式</span>
                <select id="interactionModeSelect" class="mode-select"></select>
              </label>
              <div class="mode-hint" id="interactionModeHint"></div>
            </div>
            <textarea
              id="messageInput"
              class="composer-input"
              rows="1"
              placeholder="请输入你的问题..."
            ></textarea>
            <div class="composer-actions">
              <div class="composer-tools">
                <button class="icon-button sprite sprite-attach" type="button" title="附件"></button>
                <button class="icon-button sprite sprite-command" type="button" title="命令"></button>
              </div>
              <div class="composer-primary-actions">
                <button class="voice-button" id="voiceButton" type="button" title="语音输入" aria-pressed="false">
                  <span class="voice-button-ring"></span>
                  <span class="voice-button-core">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 15.2a3.7 3.7 0 0 0 3.7-3.7V7.7A3.7 3.7 0 0 0 12 4a3.7 3.7 0 0 0-3.7 3.7v3.8a3.7 3.7 0 0 0 3.7 3.7Z"></path>
                      <path d="M18.2 11.5a.9.9 0 1 0-1.8 0 4.4 4.4 0 0 1-8.8 0 .9.9 0 1 0-1.8 0 6.2 6.2 0 0 0 5.3 6.1v2.1H8.9a.9.9 0 0 0 0 1.8h6.2a.9.9 0 1 0 0-1.8h-2.2v-2.1a6.2 6.2 0 0 0 5.3-6.1Z"></path>
                    </svg>
                  </span>
                </button>
                <button class="send-button" id="sendButton" type="button" title="发送"></button>
              </div>
            </div>
            <div class="composer-status" id="composerStatus" hidden></div>
          </div>
        </section>
      </main>

      <aside class="connection-panel">
        <h2 class="panel-heading">机器人连接</h2>

        <section class="connection-card" id="connectionCard">
          <div class="connection-topline">
            <div class="connection-status" id="connectionStatus">
              <span class="status-dot"></span>
              <span class="status-text">未连接</span>
            </div>
            <button class="card-menu" type="button" title="更多">⋮</button>
          </div>

          <div class="connection-summary">
            <div class="robot-avatar" id="robotAvatar" aria-hidden="true">
              <img src="./assets/robot-full.png" alt="" />
            </div>
            <div class="robot-meta">
              <div class="robot-name-row">
                <span class="robot-name" id="robotName">未选择机器人</span>
              </div>
              <div class="robot-detail-row">
                <span class="robot-detail-label">IP</span>
                <span class="robot-detail-value" id="robotHost">-</span>
              </div>
            </div>
          </div>

          <div class="connection-hero sprite sprite-robot" aria-hidden="true"></div>
        </section>

        <form class="connection-form" id="connectionForm">
          <label class="field">
            <span>机器人名称</span>
            <input id="connectName" name="name" type="text" value="naviai" placeholder="naviai" />
          </label>
          <label class="field">
            <span>IP 地址</span>
            <input id="connectHost" name="host" type="text" value="172.16.9.136" placeholder="172.16.9.136" />
          </label>
          <label class="field">
            <span>登录用户</span>
            <input id="connectUsername" name="username" type="text" value="naviai" placeholder="naviai" />
          </label>
          <label class="field">
            <span>登录密码</span>
            <div class="password-field">
              <input id="connectPassword" name="password" type="password" value="naviai@2024" placeholder="naviai@2024" />
              <button
                class="password-toggle"
                id="passwordToggle"
                type="button"
                title="显示密码"
                aria-label="显示密码"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    class="eye-shape"
                    d="M12 5C6.5 5 2.1 8.4 1 12c1.1 3.6 5.5 7 11 7s9.9-3.4 11-7c-1.1-3.6-5.5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"
                  />
                  <circle class="eye-pupil" cx="12" cy="12" r="2.2" />
                  <path class="eye-slash" d="M4.5 4.5 19.5 19.5" />
                </svg>
              </button>
            </div>
          </label>

          <div class="connection-actions">
            <button class="primary-button" id="connectButton" type="submit">连接机器人</button>
            <button class="ghost-button" id="disconnectButton" type="button">断开连接</button>
          </div>
        </form>
      </aside>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="message-bubble"></div>
        <div class="message-time"></div>
      </article>
    </template>

    <template id="sessionTemplate">
      <button class="session-item" type="button">
        <div class="session-title"></div>
        <div class="session-preview"></div>
      </button>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
