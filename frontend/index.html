<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobotClaw</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">RobotClaw</div>
        </div>

        <button class="new-session-button" id="newSessionButton" type="button">
          <span class="new-session-plus">+</span>
          <span>新建会话</span>
        </button>

        <section class="session-panel">
          <div class="section-title">会话列表</div>
          <div class="session-list" id="sessionList"></div>
        </section>

        <button class="settings-link" id="settingsButton" type="button">
          <span class="settings-icon">⚙</span>
          <span>设置</span>
        </button>
      </aside>

      <main class="chat-stage">
        <section class="chat-card">
          <div class="chat-scroll" id="chatScroll"></div>

          <div class="composer">
            <textarea
              id="messageInput"
              class="composer-input"
              rows="1"
              placeholder="请输入你的问题..."
            ></textarea>
            <div class="composer-image-preview" id="imagePreview" hidden></div>
            <div class="composer-actions">
              <div class="composer-tools">
                <button class="icon-button sprite sprite-attach" id="attachImageButton" type="button" title="添加图片"></button>
                <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
              </div>
              <div class="composer-primary-actions">
                <button class="voice-button" id="voiceButton" type="button" title="语音输入" aria-pressed="false">
                  <span class="voice-button-ring"></span>
                  <span class="voice-button-core">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 15.2a3.7 3.7 0 0 0 3.7-3.7V7.7A3.7 3.7 0 0 0 12 4a3.7 3.7 0 0 0-3.7 3.7v3.8a3.7 3.7 0 0 0 3.7 3.7Z"></path>
                      <path d="M18.2 11.5a.9.9 0 1 0-1.8 0 4.4 4.4 0 0 1-8.8 0 .9.9 0 1 0-1.8 0 6.2 6.2 0 0 0 5.3 6.1v2.1H8.9a.9.9 0 0 0 0 1.8h6.2a.9.9 0 1 0 0-1.8h-2.2v-2.1a6.2 6.2 0 0 0 5.3-6.1Z"></path>
                    </svg>
                  </span>
                </button>
                <button class="send-button" id="sendButton" type="button" title="发送"></button>
              </div>
            </div>
            <div class="composer-status" id="composerStatus" hidden></div>
          </div>
        </section>
      </main>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="message-bubble"></div>
        <div class="message-time"></div>
      </article>
    </template>

    <template id="sessionTemplate">
      <button class="session-item" type="button">
        <div class="session-title"></div>
        <div class="session-preview"></div>
      </button>
    </template>

    <div class="image-lightbox" id="imageLightbox" hidden>
      <button class="image-lightbox-close" id="imageLightboxClose" type="button" aria-label="关闭图片预览">×</button>
      <img class="image-lightbox-img" id="imageLightboxImg" alt="图片预览" />
    </div>

    <div class="settings-modal" id="settingsModal" hidden>
      <form class="settings-dialog" id="settingsForm">
        <div class="settings-dialog-header">
          <div>
            <div class="settings-dialog-title">设置</div>
            <div class="settings-dialog-subtitle">API_KEY 必填，其余留空使用默认配置</div>
          </div>
          <button class="settings-close" id="settingsCloseButton" type="button" aria-label="关闭设置">×</button>
        </div>

        <label class="settings-field">
          <span>API_KEY <span class="required-star">*</span></span>
          <div class="secret-field">
            <input id="openaiApiKeyInput" name="OPENAI_API_KEY" type="password" autocomplete="off" required />
            <button class="secret-toggle" id="apiKeyToggleButton" type="button" aria-label="显示 API_KEY" aria-pressed="false">
              显示
            </button>
          </div>
        </label>
        <label class="settings-field">
          <span>BASE_URL</span>
          <input id="openaiBaseUrlInput" name="OPENAI_BASE_URL" type="url" autocomplete="off" />
        </label>
        <label class="settings-field">
          <span>MODEL</span>
          <input id="openaiChatModelInput" name="OPENAI_CHAT_MODEL" type="text" autocomplete="off" />
        </label>
        <div class="settings-grid">
          <label class="settings-field">
            <span>TEMPERATURE</span>
            <input id="llmTemperatureInput" name="ROBOTCLAW_LLM_TEMPERATURE" type="number" step="0.1" min="0" />
          </label>
          <label class="settings-field">
            <span>TOP_K</span>
            <input id="topKInput" name="TOP_K" type="number" step="1" min="1" />
          </label>
        </div>
        <div class="settings-status" id="settingsStatus" hidden></div>
        <div class="settings-actions">
          <button class="ghost-button" id="settingsCancelButton" type="button">取消</button>
          <button class="primary-button" id="settingsSaveButton" type="submit">保存</button>
        </div>
      </form>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
