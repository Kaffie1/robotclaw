version: 1
description: chassis battery info missing rules

rules:
  rule_1:
    type: compare
    field: output
    op: not_empty
    cast: string

  rule_2:
    op: and
    conditions:
      - type: compare
        field: output
        op: not_empty
      - type: compare
        field: output
        op: not_contains
        value: Exited

  rule_3:
    type: compare
    field: output
    op: not_empty
    cast: string

  rule_4:
    type: compare
    field: result.exit_code
    op: equals
    cast: number
    value: 0

  rule_5:
    op: and
    conditions:
      - type: compare
        field: output
        op: not_empty
      - type: compare
        field: output
        op: not_contains
        value: ERROR
      - type: compare
        field: output
        op: not_contains
        value: failed
      - type: compare
        field: output
        op: not_contains
        value: exception
