#
# Playbook Template
# -----------------
# 这是标准 fault workflow 模板，只用于新增故障时参考。
# 真正生效的 fault workflow 应该放在：
#   workflows/fault/<workflow_id>/playbook.yaml
#
# 当前推荐写法是“行为树”：
# - 用 `root` 描述主流程
# - 用 `sequence` 表达“按顺序做，任一步失败就停”
# - 用 `selector` 表达“按顺序尝试，任一路成功就停”
# - 用 `condition` 表达“检查 / 判断”
# - 用 `action` 表达“执行动作 / 恢复动作”
# - 用 `call_playbook` 表达“调用另一个独立子 playbook”
# - 用 `result` 表达“直接给出结论”
#
# 设计原则：
# - 一个目录只放一个 playbook，避免多个故障流程混在一起
# - playbook 负责“做什么”，规则文件负责“怎么判”
# - 默认优先用行为树，而不是旧的 `script + on_fail` 线性跳转
# - 检查步骤尽量写成 `condition`
# - 恢复步骤尽量写成 `action`
# - “如果 A 不满足，就走 B” 这类逻辑优先写成 `selector`
# - `call_playbook` 只用于切换到另一个独立子问题，不要拿它当普通跳转标签
#
# 字段说明：
# - version：
#   - 当前模板版本，通常保持 1
# - description：
#   - 对这个 playbook 的整体说明
# - playbooks：
#   - playbook 列表。当前约定是一个目录一个 playbook，通常只有 1 项
# - id：
#   - playbook 的唯一标识。建议与目录名保持一致
# - title：
#   - 人类可读标题，展示在页面或日志中
# - root：
#   - 推荐写法，行为树根节点
# - context_schema：
#   - 可选，声明这个 workflow 共享的上下文字段
#   - 推荐给所有会跨节点传值的参数都显式声明
#   - source 目前推荐：
#     - `input`：流程启动时传入
#     - `runtime`：节点执行过程中生成
#     - `confirmation`：用户确认后写入
# - script：
#   - 旧兼容字段
#   - 老 playbook 还可以继续使用，但新增 playbook 默认不要再写 `script`
# - escalation_notes：
#   - 需要转人工或升级时给出的提示说明
# - execution_notes：
#   - 执行时的补充说明、约束和上下文提示
# - global_rules：
#   - 这个 playbook 的全局约束列表，通常写成短句说明
#
# 行为树节点类型：
# - sequence：
#   - 子节点按顺序执行
#   - 遇到 `failure` 或 `running` 就停
#   - 典型场景：先检查，再恢复，再复检
# - selector：
#   - 子节点按顺序尝试
#   - 遇到 `success` 就停
#   - 全部失败才返回 `failure`
#   - 典型场景：优先判断是否已经正常，否则走恢复分支
# - condition：
#   - 叶子检查节点
#   - 本质上还是“工具调用 + 断言”
# - action：
#   - 叶子动作节点
#   - 本质上还是“工具调用 + 断言”
# - call_playbook：
#   - 调用另一个独立子 playbook
#   - 子 playbook 成功后，当前树会继续往下执行
#   - 子 playbook 失败时，当前节点返回失败
# - result：
#   - 不调用工具，直接返回结果
#   - 常用来给出明确结论，例如“底盘目前没有收到速度指令”
#
# 叶子节点通用字段：
# - name：
#   - 节点名称，建议写成能看出意图的名字
# - tool_name：
#   - 后端工具名，只能从下面这些里选：
#     - `ros_list_topics`
#     - `ros_list_services`
#     - `ros_topic_info`
#     - `ros_topic_type`
#     - `ros_message_definition`
#     - `ros_topic_echo`
#     - `ros_service_info`
#     - `ros_service_type`
#     - `ros_service_definition`
#     - `ros_service_call`
#     - `ping_host`
#     - `docker_compose_down_module`
#     - `docker_compose_up_module`
#     - `remote_resolve_path`
#     - `remote_path_exists`
#     - `remote_list_dir`
#     - `remote_scan_paths`
#     - `remote_shortcuts`
#     - `remote_execute_readonly`
#     - `remote_execute_command`
#     - `remote_get_interactive_env`
#     - `remote_ensure_executable`
#     - `remote_read_file`
#     - `remote_get_file_owner`
#     - `remote_backup_path`
#     - `remote_restore_backup`
#     - `remote_remove_files_by_prefix`
#     - `docker_compose_exec_command`
#     - `ros_compose_exec_command`
#     - `package_install`
# - arguments：
#   - 传给工具的参数对象
#   - 如果参数要引用上下文，推荐：
#     - `from_context`
#     - `{{ context_field_name }}`
#   - 推荐所有 `from_context` 引用的字段都先在 `context_schema` 中声明
# - result_mapping：
#   - 可选，将工具返回结果中的字段自动写入 workflow context
#   - 例如：
#     - `options: package_options`
#     - `inferred_value: selected_option`
#   - 推荐所有映射目标字段也先在 `context_schema` 中声明
# - assert_ref：
#   - 引用同目录 `rules.yaml` 中的通用规则 id
# - assert：
#   - 直接内联写规则，不引用外部规则 id
# - failure_message：
#   - 当前节点失败时返回的人类可读说明
# - success_message：
#   - 当前节点成功时附带的人类可读说明
# - wait_seconds：
#   - 执行前等待多少秒，让现场状态稳定
# - confirm_times：
#   - 连续确认多少次都满足才算成功
#
# 人工确认字段：
# - require_confirmation：
#   - 是否需要人工确认后再继续执行
# - confirmation：
#   - 人工确认 / 人工输入 / 人工选择的详细配置块
# - confirmation.when：
#   - `before`：先问用户，再执行当前节点
#   - `after`：先执行工具，再根据工具输出问用户
# - confirmation.mode：
#   - `approve` / `input` / `select`
# - confirmation.output.store_as：
#   - 确认结果保存到哪个上下文字段里
#   - 推荐对应字段在 `context_schema` 中声明为 `source: confirmation`
# - confirmation.input.options_source.from_context：
#   - select 确认时可直接从 workflow context 里的列表字段取选项
#   - 推荐配合 `result_mapping` 一起使用
#
# 行为树写法建议：
# - “先看是否已正常，否则恢复”：
#   - 用 `selector`
# - “恢复之后还要继续后续检查”：
#   - 在 `sequence` 里把恢复节点放在前面，后面继续接检查节点
# - “有数据但全为 0，直接给出结论”：
#   - 用 `selector`
#   - 第一个子节点写“非全 0”的 `condition`
#   - 第二个子节点写 `result`
# - “这是另一个独立问题”：
#   - 用 `call_playbook`
#
# 工具输入输出的完整说明请优先以这里的注释为准。
# 如果新增工具，请先补充本模板注释，再改后端实现。
#
version: 1
description: <playbook description>

playbooks:
  - id: <playbook_id>
    title: <human readable title>
    context_schema:
      selected_option:
        type: string
        source: confirmation
      option_candidates:
        type: option_list
        source: runtime
    root:
      type: sequence | selector
      name: <root_node_name>
      children:
        - type: condition | action
          name: <node_name>
          tool_name: <tool_name>
          arguments:
            key: value
            # 如果参数要引用上下文，推荐：
            # key:
            #   from_context: <context field name>
            # 或：
            # key: "{{ context_field_name }}"
          result_mapping:
            options: option_candidates
          assert_ref: <rule_id>
          failure_message: <human readable failure message>
          success_message: <optional success message>
          wait_seconds: 10
          confirm_times: 3
          require_confirmation: true
          confirmation:
            when: before | after
            mode: approve | input | select
            message: <human readable confirmation message>
            input:
              type: text | number | integer | boolean | index
              placeholder: <input placeholder>
              label: <input label>
              help_text: <input help text>
              allow_empty: false
              auto_select_if_single: false
              options:
                - label: <option label>
                  value: <option value>
              options_source:
                from_context: option_candidates
                # 兼容旧写法时也可以从当前步骤结果里取：
                # field: raw_result
                # parser: string_list
                # list_key: options
            output:
              store_as: selected_option
              type: raw_input | boolean | selected_option_value | selected_option_label | selected_option_index
        - type: call_playbook
          name: <call_node_name>
          playbook_id: <child_playbook_id>
          failure_message: <message when child playbook still fails>
        - type: result
          name: <result_node_name>
          status: success | failure | running
          message: <human readable result message>
    escalation_notes:
      - <human readable note>
    execution_notes:
      - <human readable note>
global_rules:
  - <global rule note>
