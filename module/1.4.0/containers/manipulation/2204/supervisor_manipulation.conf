[supervisord]
nodaemon=true  ; supervisor运行时不以守护进程模式运行，适合容器
user=root

[program:pose_estimator_inference_server]
command=/bin/bash -c "source /opt/venv/foundationpose/bin/activate && python3 -u /navi_ws/src/manipulation/fdpose/scripts/pose_estimator_inference_server.py"
autostart=true
autorestart=true
stdout_logfile=/var/log/pose_estimator_inference_server.out.log
redirect_stderr=true
priority=2
startsecs=5

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# supervisorctl -c /etc/manipulation2204/supervisor_manipulation.conf restart pose_estimator_inference_server
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
