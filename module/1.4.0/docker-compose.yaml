# 全局镜像常量
x-base-image: &base-image 10.51.33.201:30002/navi_project/environment:ros1_260310

# NVIDIA 配置
x-nvidia-env: &nvidia-env
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

services:
  roscore_service:
    profiles: ["rx", "h1"]
    image: *base-image
    container_name: naviai_roscore
    privileged: true
    network_mode: host
    entrypoint:
      - /bin/bash
      - -lc
      - |
          echo '正在启动 roscore...'
          source /opt/ros/noetic/setup.bash
          exec roscore
    environment:
      - ROBOT_MODEL=${ROBOT_MODEL}
      - ROS_MASTER_URI=${ROS_MASTER_URI}
      - ROS_IP=${ROS_IP}
      - ROS_HOSTNAME=${ROS_HOSTNAME}
    healthcheck:
      # 直接检查 11311 端口是否可连接，避免镜像内缺少 netstat 导致误判。
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/11311'"]
      interval: 1s # 每隔 1 秒检查一次
      timeout: 5s # 每次检查的超时时间为 5 秒
      retries: 30 # 重试 30 次，如果 30 次后仍然失败，则将容器标记为 unhealthy
      start_period: 5s # 启动容器后，等待 5 秒再开始第一次健康检查，给 roscore 足够的启动时间
    restart: unless-stopped

  sensor:
    image: 10.51.33.201:30002/navi_project/sensor:${SENSOR_IMAGE_TAG}
    container_name: naviai_sensor
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      SENSOR_IMAGE_TAG: ${SENSOR_IMAGE_TAG}
      DISPLAY: 127.0.0.1:99.0
    volumes:
      - /dev:/dev     
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./logs/sensor:/var/log
      - ./containers/sensor/entrypoint.sh:/etc/naviai/entrypoint.sh
      - ./containers/sensor/generate_config.py:/etc/naviai/generate_config.py
      - ./containers/sensor/supervisor.conf.j2:/etc/naviai/supervisor.conf.j2
      - ./config/sensor/sensor_config.yml:/etc/naviai/sensor_config.yml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./.dists/sensor:/package
      - ./containers/shared:/shared
    entrypoint: ["/bin/bash", "-c", "/etc/naviai/entrypoint.sh"]
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_SENSOR:-1}

  sensor_lidar:
    profiles: ["wa1", "wa2"] # wa系列待适配
    image: *base-image
    container_name: naviai_sensor_lidar
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./.dists/sensor_lidar:/package
      - ./logs/sensor_lidar:/var/log
      - ./containers/shared:/shared
      - ./containers/sensor_lidar/:/etc/naviai/
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_SENSOR_LIDAR:-1}

  demos:
    image: 10.51.33.201:30002/navi_project/demos:v1.0.2
    container_name: naviai_demos
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./logs/demos:/var/log
      - ./containers/shared:/shared
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined

  manipulation:
    profiles: ["h1"] # wa系列待适配
    image: 10.51.33.201:30002/navi_project/manipulation:25R3_V1.0.6
    container_name: naviai_manipulation
    network_mode: host
    privileged: true
    runtime: nvidia
    shm_size: 32g
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./containers/manipulation/2004/generate_config.py:/etc/manipulation/generate_config.py
      - ./containers/manipulation/2004/supervisor.conf.j2:/etc/manipulation/supervisor.conf.j2
      - ./logs/manipulation/2004:/var/log
      - ./containers/shared:/shared
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_MANIPULATION:-1}

  manip2204e:
    profiles: ["h1"] # wa系列待适配，且manip2204e镜像仅支持2204系统
    image: 10.51.33.201:30002/navi_project/manipulation:2204e_V1.0.1
    container_name: naviai_manipulation_2204e
    network_mode: host
    privileged: true
    runtime: nvidia
    shm_size: 32g
    restart: unless-stopped
    depends_on:
      roscore_service:
        # condition: 不仅等待 roscore_service 启动，还要等待其 healthcheck 状态变为 healthy
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      QT_X11_NO_MITSHM: ${QT_X11_NO_MITSHM:-1}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./logs/manipulation/2204:/var/log
      - ./containers/shared:/shared
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_MANIPULATION:-1}

  robot:
    image: *base-image
    container_name: naviai_robot
    network_mode: host
    privileged: true
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
      AUTO_BUILD_WS: ${AUTO_BUILD_WS:-1}
      ZJ_VERSION: ${ZJ_VERSION}
      ROBOT_TYPE: ${ROBOT_TYPE}
    volumes:
      - /tmp:/tmp
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./logs/robot/:/var/log/
      - ./.dists/robot:/package
      - ./containers/robot/:/etc/naviai/
      - ./containers/shared:/shared
      - /var/run/dbus:/var/run/dbus
      - ./config/robot/audio_config.yaml:/navi_ws/src/monitor/audio_config.yaml
    restart: unless-stopped
    deploy:
      replicas: ${ENABLE_ROBOT:-1}

  audio:
    image: 10.51.33.201:30002/navi_project/audio:${AUDIO_IMAGE_TAG:-v1.1.1}
    container_name: naviai_audio
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      AUDIO_MIC_DEVICE: ${AUDIO_MIC_DEVICE:-AIUI}
      AUDIO_SPEAKER_DEVICE: ${AUDIO_SPEAKER_DEVICE:-YUNJI31993Ultra}
      ENABLE_MIC: ${ENABLE_MIC:-true}
      ENABLE_SPEAKER: ${ENABLE_SPEAKER:-true}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.dists/audio:/package
      - ./containers/audio/entrypoint.sh:/etc/naviai/entrypoint.sh
      - ./containers/audio/supervisor.conf:/etc/naviai/supervisor.conf
      - ./logs/audio:/var/log
      - ./containers/shared:/shared
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /dev/snd:/dev/snd
    entrypoint: ["/bin/bash", "-c", "/etc/naviai/entrypoint.sh"]
    security_opt:
      - seccomp:unconfined

  navbrain_ros:
    image: 10.51.33.201:30002/navi_project/navbrain_ros:v2.2.zeta 
    container_name: naviai_navbrain_ros
    platform: linux/arm64
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    volumes:
      - ./containers/shared:/shared
      - ./logs/navbrain_ros:/navi_ws/logs
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
    command: ["/bin/bash", "/navi_ws/start_ros_nodes_product.sh"]
    dns:
      - 8.8.8.8
      - 223.5.5.5


  rosbridge:
    image: *base-image
    container_name: naviai_rosbridge
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./logs/rosbridge:/var/log
      - ./containers/rosbridge/src:/navi_ws/src
      - ./containers/rosbridge/entrypoint.sh:/etc/naviai/entrypoint.sh
      - ./containers/rosbridge/supervisor.conf:/etc/naviai/supervisor.conf
      - ./containers/shared:/shared
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_ROSBRIDGE:-1}

  nviz:
    profiles: ["rx", "wa1", "wa2"]
    image: 10.51.33.201:30002/navi_project/nviz:ros1_260311
    container_name: naviai_nviz
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: ${DISPLAY}
      ROBOT_MODEL: ${COMPOSE_PROFILES}
    volumes:
      - /tmp:/tmp
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./logs/nviz/:/var/log/
      - ./.dists/nviz/:/package/
      - ./containers/nviz/docker/:/etc/naviai/
      - ./containers/nviz/bag:/opt/ros/noetic/share/nviz/bag
      - ./config/nviz/config:/navi_ws/src/nviz/algorithm/config
    devices:
      - /dev:/dev
    stdin_open: true
    tty: true
    privileged: true
    restart: unless-stopped
    network_mode: host
    security_opt:
      - seccomp:unconfined
    shm_size: "512mb"
    ipc: host
    deploy:
      replicas: ${ENABLE_NVIZ:-1}

  perception:
    profiles: ["wa1", "wa2", "rx"]
    image: *base-image
    container_name: naviai_perception
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
      PERCEPTION_ROBOT_MODEL: ${COMPOSE_PROFILES}
    platform: linux/arm64
    privileged: true
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    volumes:
      - /tmp:/tmp
      - ./containers/perception/datasets/:/datasets/
      - ./logs/perception/:/var/log/
      - ./config/perception/wa/config_wa1.json:/navi_ws/src/naviai_mapping_octree/config_wa1.json
      - ./config/perception/wa/config_wa2.json:/navi_ws/src/naviai_mapping_octree/config_wa2.json
      - ./config/perception/wa/mid360_wa1.yaml:/navi_ws/src/naviai_odometry_lio/config/mid360_wa1.yaml
      - ./config/perception/wa/mid360_wa2.yaml:/navi_ws/src/naviai_odometry_lio/config/mid360_wa2.yaml
      - ./containers/shared/navigation/ros_interface.yaml:/navi_ws/src/naviai_odometry_lio/config/ros_interface.yaml
      - ./config/perception/rx/config_rx.json:/navi_ws/src/naviai_mapping_octree/config_rx.json
      - ./config/perception/rx/subscribe.launch:/tmp/perception/launch/subscribe.launch
      - ./config/perception/rx/rx/:/tmp/perception/config/rx/
      - ./config/perception/rx/reloc.yaml:/tmp/perception/config/reloc.yaml
      - ./containers/perception/:/etc/naviai/
      - ./.dists/perception:/package
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
        replicas: ${ENABLE_PERCEPTION:-1}

  map_server:
    profiles: ["rx", "wa1", "wa2"]
    image: *base-image
    container_name: naviai_map_server
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
      NAVIGATION_ROBOT_MODEL: ${COMPOSE_PROFILES}
    platform: linux/arm64
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./containers/map_server/:/etc/naviai/
      - ./logs/map_server:/var/log
      - ./.dists/map_server:/package
      - ./containers/perception/datasets/:/navi_ws/map_config/
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
        replicas: ${ENABLE_MAP_SERVER:-1}
  
  navigation:
    profiles: ["rx", "wa1", "wa2"]
    image: *base-image
    container_name: naviai_navigation
    depends_on:
      roscore_service:
        condition: service_healthy
        required: false
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
      NAVIGATION_ROBOT_MODEL: ${COMPOSE_PROFILES}
    platform: linux/arm64
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./containers/navigation/:/etc/naviai/
      - ./logs/navigation:/var/log
      - ./.dists/navigation:/package
      - ./config/navigation/config:/navi_ws/src/navigation/config
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_NAVIGATION:-1}
    

  chassis:
    profiles: ["wa1", "wa2"]
    image: *base-image
    container_name: naviai_chassis
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI}
      ROS_IP: ${ROS_IP}
      DISPLAY: 127.0.0.1:99.0
      ROBOT_MODEL: ${COMPOSE_PROFILES}
    platform: linux/arm64
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/naviai/.Xauthority:/root/.Xauthority
      - ./.dists/chassis:/package
      - ./containers/chassis/:/etc/naviai/
      - ./logs/chassis:/navi_ws/src/logs
    devices:
      - /dev:/dev
    security_opt:
      - seccomp:unconfined
    deploy:
      replicas: ${ENABLE_CHASSIS:-1}

  novnc:
    image: 10.51.33.201:30002/navi_project/novnc:v1.0.2
    container_name: naviai_novnc
    network_mode: host
    restart: unless-stopped
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - DISPLAY=:99
      - VNC_PORT=5999
    volumes:
      - ./logs/novnc:/var/log
    deploy:
      replicas: ${ENABLE_NOVNC:-1}
      
  robot_viewer:
    image: 10.51.33.201:30002/navi_project/robot_viewer:v1.0.2
    container_name: naviai_robot_viewer
    privileged: true
    ports:
      - 10002:3000
    environment:
      ZJ_VERSION: ${ZJ_VERSION}
      ROBOT_TYPE: ${ROBOT_TYPE}
      VITE_ALLOWED_HOSTS: all
    restart: unless-stopped
    deploy:
      replicas: ${ENABLE_ROBOT_VIEWER:-1}

volumes:
  portainer_data:
    driver: local