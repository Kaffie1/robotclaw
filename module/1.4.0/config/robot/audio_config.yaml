# =============================================================================
# 机器人模块监控配置文件
# =============================================================================
#
# 【如何添加新节点监控】
#   1. 在下方添加新的模块配置块，格式如下：
#      MODULE_NAME:
#        enable: false
#        audio_error_path: ""
#        audio_normal_path: ""
#        topic: "/your/ros/topic"
#   2. MODULE_NAME 可以是任意名称（建议使用大写下划线格式）
#   3. topic 必须是实际存在的 ROS topic
#
# 【如何删除节点监控】
#   直接删除对应的配置块即可
#
# 【如何开启语音告警】
#   1. 设置 enable: false 启用该模块监控
#   2. 设置 audio_error_path 为异常时的语音文件路径（如："/home/naviai/audio/error.wav"）
#   3. 设置 audio_normal_path 为正常时的语音文件路径（如："/home/naviai/audio/normal.wav"）
#   4. 语音文件格式支持： wav 等常见音频格式
#
# 【配置项说明】
#   enable:           是否启用该模块监控（true=启用，false=不启用）
#   audio_error_path: 模块异常（无数据）时的语音提示路径，空字符串表示不播放
#   audio_normal_path: 模块正常（有数据）时的语音提示路径，空字符串表示不播放
#   topic:            ROS topic 接口名称，程序会监控该 topic 是否有数据传输
#
# 【注意事项】
#   - 节点名称（MODULE_NAME）不能重复
#   - topic 必须是实际存在的 ROS topic，否则会显示为异常
#   - 修改配置后需要调用 reload 服务使配置生效：
#     rosservice call /zj_humanoid/robot/monitor_reload_config
#   - 监控状态会发布在 /zj_humanoid/robot/monitor_status 话题上（JSON格式）
#
# =============================================================================

# 模块配置

