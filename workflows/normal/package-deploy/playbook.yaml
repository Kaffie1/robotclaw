version: 1
description: package deploy playbook

playbooks:
  - id: package-deploy
    type: normal
    title: 整包部署
    # context_schema 用来显式声明这个 workflow 会跨节点共享的上下文字段。
    # 约定：
    # - input：流程启动时传入
    # - runtime：节点执行过程中生成
    # - confirmation：用户确认后写入
    context_schema:
      # 安装包来源与任务级输入
      source_metadata: { type: object, source: input }
      upload_token: { type: string, source: input }

      # 目标设备与部署目标
      device_type: { type: string, source: input }
      remote_deb_path: { type: string, source: input }

      # 目标凭证：用于需要带目标账号密码执行的安装命令
      target_username: { type: string, source: input }
      target_password: { type: string, source: input }

      # 安装包准备节点产出的运行时字段
      file_name: { type: string, source: runtime }
      file_size: { type: integer, source: runtime }
      local_tmp_path: { type: string, source: runtime }

      # 选项探测节点产出的运行时字段
      package_options: { type: option_list, source: runtime }
      inferred_option: { type: string, source: runtime }

      # 用户确认后写回的最终部署参数
      machine_type: { type: string, source: confirmation }
    task_progress:
      default_phase: preparing
      waiting_confirmation_phase: waiting_confirmation
      success_phase: completed
      failure_phase: failed
    root:
      type: sequence
      name: deploy_package_on_orin
      display_name: 执行整包部署
      children:
        - type: action
          name: prepare_package_source
          display_name: 准备部署安装包来源
          progress:
            phase: preparing
            message: 正在准备部署安装包来源
          tool_name: prepare_artifact_sources
          arguments:
            source_items:
              - source_metadata:
                  from_context: source_metadata
            upload_token:
              from_context: upload_token
          failure_message: 安装包来源准备失败，请检查本地上传文件或文件服务器路径
        - type: action
          name: stage_package_to_remote_target
          display_name: 准备远端安装包
          progress:
            phase: uploading_to_robot
            message: 正在准备远端安装包
          tool_name: remote_stage_artifacts
          arguments:
            device_type:
              from_context: device_type
            target_root:
              from_context: remote_deb_path
            target_mode: exact_path
            artifact_items:
              - file_name:
                  from_context: file_name
                local_tmp_path:
                  from_context: local_tmp_path
                file_size:
                  from_context: file_size
            upload_token:
              from_context: upload_token
          assert_ref: rule_2
          failure_message: 远端安装包准备失败，请检查上传状态、远端目录权限或同名旧包清理结果
        - type: condition
          name: verify_remote_package_exists
          display_name: 检查安装包是否存在
          progress:
            phase: preparing
            message: 正在检查安装包是否存在
          tool_name: remote_path_exists
          arguments:
            device_type:
              from_context: device_type
            path:
              from_context: remote_deb_path
          assert_ref: rule_1
          failure_message: 远端安装包不存在，请先上传安装包或确认路径正确
        - type: action
          name: probe_package_options
          display_name: 探测整包可选参数
          progress:
            phase: probing_options
            message: 正在探测整包可选参数
          tool_name: remote_execute_with_fallback
          arguments:
            device_type:
              from_context: device_type
            command_template: "chmod +x {deb_path} && {deb_path} --quiet -- support_robot_types"
            command_args:
              deb_path:
                from_context: remote_deb_path
            parse_mode: options
            on_failure: use_fallback
            fallback_value:
              - { value: "H1",       label: "H1" }
              - { value: "U1",       label: "U1" }
              - { value: "U2_WA1",   label: "U2_WA1" }
              - { value: "I2",       label: "I2" }
              - { value: "WA1",      label: "WA1" }
              - { value: "WA1_400L", label: "WA1_400L" }
              - { value: "WA1_400K", label: "WA1_400K" }
              - { value: "WA2",      label: "WA2" }
              - { value: "WA2_LS",   label: "WA2_LS" }
              - { value: "WA2_TY20", label: "WA2_TY20" }
              - { value: "WA2_L",    label: "WA2_L" }
              - { value: "U1_WA1",   label: "U1_WA1" }
          # 将工具返回的通用 options / inferred_value 自动写回 workflow context，
          # 后面的确认节点和安装节点都直接从 context 取值。
          result_mapping:
            options: package_options
            inferred_value: inferred_option
          require_confirmation: true
          confirmation:
            when: after
            mode: select
            message: 请选择这次整包部署的目标机型
            progress:
              phase: waiting_confirmation
              message: 等待选择整包部署参数
            input:
              type: index
              auto_select_if_single: false
              options_source:
                # 选项直接从 workflow context 里的 package_options 读取，
                # 不再依赖当前步骤 raw_result 的固定结构。
                from_context: package_options
            output:
              # 用户最终选择的值会写回 context.machine_type，
              # 后续安装命令继续通过 from_context 引用它。
              store_as: machine_type
              type: selected_option_value
        - type: action
          name: ensure_package_is_executable
          display_name: 修复安装包执行权限
          progress:
            phase: installing
            message: 正在修复安装包执行权限
          tool_name: remote_ensure_executable
          arguments:
            device_type:
              from_context: device_type
            path:
              from_context: remote_deb_path
          assert_ref: rule_2
          failure_message: 安装包执行权限修复失败，请先检查文件权限
        - type: action
          name: install_package_on_selected_robot_type
          display_name: 执行整包安装
          progress:
            phase: installing
            message: 正在执行整包安装
          tool_name: remote_execute_with_fallback
          arguments:
            device_type:
              from_context: device_type
            command_template: "chmod +x {deb_path} && {deb_path} -- --device_type={device_type} --force --robot_type={machine_type} --user={target_username} --password={target_password}"
            command_args:
              deb_path:
                from_context: remote_deb_path
              device_type:
                from_context: device_type
              machine_type:
                from_context: machine_type
              target_username:
                from_context: target_username
              target_password:
                from_context: target_password
            target_credentials_probe:
              removable_args:
                - "--user={target_username}"
                - "--password={target_password}"
            parse_mode: command_result
            on_failure: return_raw
            timeout_seconds: 1800
          assert_ref: rule_3
          failure_message: 安装命令执行失败，请查看安装包输出和目标环境
    escalation_notes:
      - "整包部署会先在任务内准备安装包来源，再上传到目标处理器执行安装"
      - "如果安装包本身不支持当前选项，先重新确认部署参数或更换安装包"
    execution_notes:
      - "这是第一版部署行为树，目标是先打通整包部署编排链路"
      - "安装前会先通过共享的来源准备节点处理本地上传或文件服务器输入"
      - "安装前会先通过共享的远端上传节点把安装包放到目标路径"
      - "安装前会先修复安装包执行权限"
      - "安装前会先通过通用命令执行节点调用 support_robot_types 探测安装包支持的可选参数"
      - "选项探测节点会在 workflow 参数里声明失败策略，当前失败时回退到默认选项列表"
      - "安装阶段也通过通用命令执行节点下发 install command，并由 workflow 声明失败策略与超时时间"
      - "当前版本把探测命令和安装命令直接声明在 workflow 参数里，tool 只消费这些参数"
      - "当前固定部署到 ORIN，不处理 PICO 和跳板部署"
      - "当前版本安装完成后不执行健康检查，安装步骤成功即进入任务收口"

global_rules:
  - 整包部署会先准备安装包来源，再上传到目标处理器执行安装
  - 第一版整包部署不自动回滚
