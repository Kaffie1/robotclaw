version: 1
description: module deploy playbook

playbooks:
  - id: module-deploy
    type: normal
    title: 模块部署
    root:
      type: sequence
      name: deploy_module
      display_name: 执行模块部署
      children:
        - type: action
          name: prepare_module_packages
          display_name: 准备模块安装包来源
          tool_name: module_prepare_packages
          arguments: {}
          failure_message: 模块安装包来源准备失败，请检查本地上传文件或文件服务器路径
        - type: action
          name: replace_remote_module_assets
          display_name: 替换自动部署模块资源
          tool_name: module_replace_remote_assets
          arguments:
            module_name:
              from_context: module_name
            auto_deploy:
              from_context: auto_deploy
            auto_deploy_version:
              from_context: auto_deploy_version
          assert_ref: rule_1
          failure_message: 自动模块部署资源替换失败，请检查版本目录与机器人项目目录
        - type: action
          name: stage_module_packages
          display_name: 上传模块安装包
          tool_name: module_stage_packages
          arguments:
            module_name:
              from_context: module_name
            module_path:
              from_context: module_path
            auto_deploy:
              from_context: auto_deploy
          assert_ref: rule_2
          failure_message: 模块安装包上传失败，请检查旧包清理与机器人目录权限
        - type: action
          name: install_module
          display_name: 执行模块安装
          tool_name: module_install
          arguments:
            module_name:
              from_context: module_name
            module_path:
              from_context: module_path
            install_template:
              from_context: install_template
          assert_ref: rule_3
          failure_message: 模块安装命令执行失败，请检查模块安装脚本输出
        - type: action
          name: start_module
          display_name: 启动模块
          tool_name: module_start
          arguments:
            module_name:
              from_context: module_name
            module_path:
              from_context: module_path
            start_command:
              from_context: start_command
            up_wait_seconds:
              from_context: up_wait_seconds
          assert_ref: rule_1
          failure_message: 模块启动命令执行失败，请检查启动脚本输出
        - type: action
          name: check_module_health
          display_name: 检查模块健康状态
          tool_name: module_health_check
          arguments:
            module_name:
              from_context: module_name
            module_path:
              from_context: module_path
            health_command:
              from_context: health_command
            rollback_template:
              from_context: rollback_template
            auto_rollback:
              from_context: auto_rollback
          assert_ref: rule_4
          failure_message: 模块健康检查失败，请检查模块运行状态或回滚结果
    execution_notes:
      - "模块部署会先准备安装包来源，再按模块目录清理旧包并上传新包"
      - "自动模块部署会先替换本地版本目录中的 config、containers 和 docker-compose 片段"
      - "安装完成后会按配置等待并执行启动命令"
      - "健康检查失败时，如启用了自动回滚，会优先尝试回滚"

