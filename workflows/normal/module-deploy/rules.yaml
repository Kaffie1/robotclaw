version: 1
description: module deploy rules

rules:
  rule_1:
    op: or
    conditions:
      - type: compare
        field: result.exit_code
        op: equals
        cast: number
        value: 0
      - type: compare
        field: skipped
        op: boolean_true
      - type: compare
        field: auto_deploy
        op: equals
        value: false

  rule_2:
    type: compare
    field: result.exit_code
    op: equals
    cast: number
    value: 0

  rule_3:
    type: compare
    field: result.exit_code
    op: equals
    cast: number
    value: 0

  rule_4:
    op: or
    conditions:
      - type: compare
        field: skipped
        op: boolean_true
      - type: compare
        field: result.exit_code
        op: equals
        cast: number
        value: 0
      - op: and
        conditions:
          - type: compare
            field: auto_rollback
            op: boolean_true
          - type: compare
            field: rollback_result.exit_code
            op: equals
            cast: number
            value: 0
