version: 1
description: robot not moving diagnosis playbook

playbooks:
  - id: robot-not-moving
    type: fault
    title: 小车不动
    root:
      type: sequence
      name: diagnose_robot_not_moving
      display_name: 排查小车不动
      children:
        - type: selector
          name: ensure_cmd_vel_available
          display_name: 确认速度话题有数据
          children:
            - type: condition
              name: check_cmd_vel_calib_has_data
              display_name: 检查速度话题数据
              tool_name: ros_topic_echo
              arguments:
                name: /zj_humanoid/cmd_vel/calib
              assert_ref: rule_1
            - type: call_playbook
              name: restart_chassis_when_cmd_vel_missing
              display_name: 转入底盘重启恢复
              playbook_id: restart-chassis-when-cmd-vel-missing
              failure_message: /zj_humanoid/cmd_vel/calib 当前没有数据，先重启 chassis 容器
        - type: selector
          name: ensure_non_zero_cmd_vel
          display_name: 确认速度值不为零
          children:
            - type: condition
              name: check_cmd_vel_calib_not_all_zero
              display_name: 检查速度值非零
              tool_name: ros_topic_echo
              arguments:
                name: /zj_humanoid/cmd_vel/calib
              assert_ref: rule_2
            - type: result
              name: report_zero_velocity
              display_name: 返回速度为零
              status: failure
              message: /zj_humanoid/cmd_vel/calib 有数据但全为 0，底盘目前没有收到速度指令
        - type: condition
          name: confirm_cmd_vel_calib_not_all_zero
          display_name: 连续确认速度恢复
          tool_name: ros_topic_echo
          arguments:
            name: /zj_humanoid/cmd_vel/calib
          assert_ref: rule_2
          confirm_times: 2
          failure_message: /zj_humanoid/cmd_vel/calib 需要连续确认不是全 0，当前还不能判定速度指令链路稳定
    escalation_notes:
      - "如果 /zj_humanoid/cmd_vel/calib 长时间无数据，且重启 chassis 后仍无数据，请继续检查 rosbridge、底盘模块和上游导航/遥控链路"
      - "如果 /zj_humanoid/cmd_vel/calib 有数据但持续全 0，本 playbook 直接返回底盘目前没有收到速度指令，不再自动恢复 chassis"
      - "如果 /zj_humanoid/cmd_vel/calib 短暂恢复后又回到全 0，转底盘或导航同事继续定位上游原因"
    execution_notes:
      - "ROS 检查通过 rosbridge 环境执行"
      - "先判定 /zj_humanoid/cmd_vel/calib 是否有数据，再判定速度指令是否全为 0"
      - "只有在 /zj_humanoid/cmd_vel/calib 无数据时，才跳转到 chassis 重启子 playbook"

global_rules:
  - 只使用 protocol.md 中真实存在的接口名
  - 同一任务中最多执行一次自动恢复
  - 有数据但全为 0 时直接给出结论，不重复做容器恢复
