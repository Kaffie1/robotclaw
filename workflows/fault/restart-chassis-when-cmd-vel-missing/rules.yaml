version: 1
description: restart chassis when cmd_vel missing rules

rules:
  rule_1:
    type: compare
    field: output
    op: not_empty
    cast: string

  rule_2:
    type: compare
    field: output
    op: regex_match
    value: "(?m)^\\s*(?:x|y|z):\\s*(?!0(?:\\.0+)?(?:\\s|$))[-+]?(?:\\d+(?:\\.\\d+)?|\\.\\d+)"

  rule_3:
    op: and
    conditions:
      - type: compare
        field: output
        op: not_empty
      - type: compare
        field: output
        op: not_contains
        value: ERROR
      - type: compare
        field: output
        op: not_contains
        value: failed
      - type: compare
        field: output
        op: not_contains
        value: exception
