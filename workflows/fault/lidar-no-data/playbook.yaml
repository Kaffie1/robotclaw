version: 1
description: lidar diagnosis playbook

playbooks:
  - id: lidar-no-data
    type: fault
    title: 激光没有数据
    task_progress:
      default_phase: diagnosing
      waiting_confirmation_phase: waiting_confirmation
      success_phase: completed
      failure_phase: failed
    root:
      type: sequence
      name: diagnose_lidar_no_data
      display_name: 排查激光无数据
      children:
        - type: condition
          name: ping_lidar_host
          display_name: 检查激光网络连通性
          progress:
            phase: diagnosing
            message: 正在检查激光网络连通性
          tool_name: ping_host
          arguments:
            host: 192.168.217.17
            count: 1
            timeout_seconds: 2
          assert_ref: rule_1
          failure_message: 192.168.217.17 不通，先确保通信正常，可参考飞书云文档中的mid360操作文档
        - type: action
          name: docker_compose_down_sensor_lidar
          display_name: 关闭激光容器
          progress:
            phase: recovering
            message: 正在停止激光容器
          tool_name: docker_compose_down_module
          arguments:
            module_name: sensor_lidar
          assert_ref: rule_2
          failure_message: sensor_lidar 容器停止失败，请询问相关人员
        - type: action
          name: docker_compose_up_sensor_lidar
          display_name: 启动激光容器
          progress:
            phase: recovering
            message: 正在启动激光容器
          tool_name: docker_compose_up_module
          arguments:
            module_name: sensor_lidar
          assert_ref: rule_2
          failure_message: sensor_lidar 容器启动失败，请询问相关人员
        - type: condition
          name: check_lidar_point_num
          display_name: 检查激光点云数据中
          progress:
            phase: verifying
            message: 正在检查激光点云数据
          tool_name: ros_topic_echo
          wait_seconds: 10
          arguments:
            name: /livox/lidar
          assert_ref: rule_3
          failure_message: point_num 没有大于 10000，请询问相关人员
    escalation_notes:
      - "如果 192.168.217.17 不通，先恢复网络通信"
      - "sensor_lidar 容器 down / up 后 point_num 仍然没有大于 10000 时，请询问相关人员"
    execution_notes:
      - "这是子 playbook，通常由其他 playbook 的 on_fail.call_playbook 调用"
      - "先确认激光 IP 通信正常，再进行容器恢复"

global_rules:
  - 没有明确模块名时，只读排查
  - 同一任务中最多执行一次自动恢复
  - 恢复失败后立即转人工
